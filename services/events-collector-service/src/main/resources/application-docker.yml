spring:
  config:
    activate:
      on-profile: docker
  kafka:
    bootstrap-servers: kafka:29092
    consumer:
      properties:
        schema.registry.url: ${SCHEMA_REGISTRY_URL_DOCKER}
    producer:
      bootstrap-servers: kafka:29092

  data:
    redis:
      host: redis
      port: 6379

clickhouse:
  url: jdbc:clickhouse://clickhouse:${CLICKHOUSE_PORT}/${CLICKHOUSE_DB}

management:
  server:
    port: 8091
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    endpoint: http://alloy:4318
    protocol: http/protobuf
    metrics:
      export:
        url: http://alloy:4318/v1/metrics
        step: 1m